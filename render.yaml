services:
  - type: web
    name: halara-coffee-club-pos
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    disk:
      name: halara-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HALARA_DATA_DIR
        value: /var/data
      - key: HALARA_SESSION_DAYS
        value: "7"
